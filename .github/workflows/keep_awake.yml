name: Mantener App de Streamlit Despierta

on:
  schedule:
    # Se ejecuta cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch:

# Permiso necesario para que el bot pueda hacer el push de los JSON
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de Selenium
        run: python keep_awake.py

      - name: Verificar estado de CI & ETL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check_ci_status.py

      - name: Publicar badges si cambió algún estado
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uptime.json ci_status.json uptime.svg ci_status.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(badges): update uptime and ci status"
            git push
          fi

name: Mantener App de Streamlit Despierta

on:
  schedule:
    # Se ejecuta cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch:

# Permiso necesario para que el bot pueda hacer el push del JSON
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de Selenium
        run: python keep_awake.py

      - name: Actualizar Badge de Uptime
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add uptime.json
          # Solo hace commit si hubo un cambio real en el estado (de ONLINE a OFFLINE o viceversa)
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualizar estado de Uptime Badge"
          git push
